<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Torniamo presto</title>
<style>
  html, body { margin: 0; height: 100%; background: #020403; color: #c9f7d4; }
  body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; font: 16px/1.6 ui-monospace, Menlo, Consolas, monospace; text-align: center; }
  h1 { margin: 0 0 12px; font-size: clamp(26px, 6vw, 44px); color: #ffc94a; }
  p { margin: 0; color: #7aa886; }
  .c { color: #00ff41; animation: b 1s steps(1) infinite; }
  @keyframes b { 50% { opacity: 0; } }
</style>
</head>
<body>
  <main>
    <h1>Torniamo presto<span class="c">_</span></h1>
    <p>Il sito è in aggiornamento.</p>
  </main>
</body>
</html>
